; Pro4Rail Firmware. Bauen: siehe firmware/README.md
[platformio]
default_envs = esp32s3, esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -Os -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11
lib_extra_dirs = libs

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3.csv
build_flags = ${env.build_flags} -DBOARD_S3 -DBOARD_HAS_PSRAM

[env:esp32]
board = esp32dev
board_build.partitions = partitions-esp32.csv
build_flags = ${env.build_flags} -DBOARD_ESP32
